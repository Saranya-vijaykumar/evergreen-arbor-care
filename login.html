<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Evergreen Arbor Care</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0e2a1b 0%, #1a4d33 45%, #2d7a4f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.25rem;
      color: #1f2937;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 1.25rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 440px;
      padding: 2.25rem 2rem;
      margin: auto;
    }
    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 1.15rem;
    }
    .brand-logo-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s ease, filter 0.2s ease;
      cursor: pointer;
    }
    .brand-logo-link:hover {
      transform: scale(1.06);
      filter: drop-shadow(0 6px 16px rgba(27, 109, 36, 0.45));
    }
    .logo-circle {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #1b6d24 0%, #22c55e 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(27, 109, 36, 0.35);
      border: 2px solid rgba(255, 255, 255, 0.9);
    }
    .auth-title {
      font-size: 1.65rem;
      font-weight: 800;
      color: #111827;
      text-align: center;
      letter-spacing: -0.025em;
      margin-bottom: 0.25rem;
    }
    .auth-subtitle {
      font-size: 0.875rem;
      color: #6b7280;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1.15rem;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.4rem;
    }
    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #d1d5db;
      border-radius: 0.625rem;
      font-size: 0.95rem;
      font-family: inherit;
      color: #111827;
      background-color: #f9fafb;
      outline: none;
      transition: all 0.2s ease;
    }
    .input-field:focus {
      background-color: #ffffff;
      border-color: #1b6d24;
      box-shadow: 0 0 0 3px rgba(27, 109, 36, 0.15);
    }
    .input-field::placeholder {
      color: #9ca3af;
    }
    .toggle-pw-wrapper {
      position: relative;
      width: 100%;
    }
    .toggle-pw-wrapper input {
      padding-right: 2.75rem;
    }
    .eye-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }
    .eye-btn:hover {
      color: #374151;
    }
    .error-banner {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 0.7rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
      text-align: center;
    }
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: #1b6d24;
      color: #ffffff;
      border: none;
      border-radius: 0.625rem;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(27, 109, 36, 0.25);
      transition: all 0.2s ease;
      margin-top: 0.25rem;
    }
    .btn-submit:hover {
      background: #15571d;
      box-shadow: 0 6px 16px rgba(27, 109, 36, 0.35);
      transform: translateY(-1px);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .btn-submit:disabled {
      background: #86b48d;
      cursor: not-allowed;
      transform: none;
    }
    .demo-box {
      margin-top: 1.25rem;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 0.5rem;
      padding: 0.65rem 0.85rem;
      font-size: 0.82rem;
      color: #166534;
      text-align: center;
      transition: all 0.2s ease;
      user-select: none;
    }
    .demo-box:hover {
      background: #dcfce7;
      border-color: #86efac;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(22, 101, 52, 0.15);
    }
    .auth-footer {
      text-align: center;
      font-size: 0.875rem;
      color: #6b7280;
      margin-top: 1.5rem;
    }
    .auth-footer a {
      color: #1b6d24;
      font-weight: 600;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .back-home {
      display: inline-block;
      text-align: center;
      font-size: 0.825rem;
      color: #6b7280;
      text-decoration: none;
      margin-top: 0.85rem;
      transition: color 0.15s;
    }
    .back-home:hover {
      color: #1b6d24;
      text-decoration: underline;
    }
    .footer-center {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <!-- Clickable Official Brand Logo -->
    <div class="logo-container">
      <a href="index.html" class="brand-logo-link" title="Click to Return to ArborPro Home">
        <div class="logo-circle">
          <span class="material-symbols-outlined text-[32px] text-white">forest</span>
        </div>
      </a>
    </div>

    <h1 class="auth-title">Evergreen Arbor Care</h1>
    <p class="auth-subtitle">Admin Dashboard — Sign In</p>

    <div id="error-msg" class="error-banner"></div>

    <!-- Direct Access Button (No Password Required) -->
    <a href="admin.html" id="quick-enter-btn" class="btn-submit" style="display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; margin-bottom: 1.25rem; background: linear-gradient(135deg, #012d1d 0%, #1b6d24 100%);">
      <span class="material-symbols-outlined text-[20px]">dashboard</span>
      Enter Dashboard Directly (No Password)
    </a>

    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 1.25rem;">
      <div style="flex: 1; height: 1px; background: #e5e7eb;"></div>
      <span style="font-size: 0.75rem; color: #9ca3af; text-transform: uppercase; font-weight: 600;">or sign in</span>
      <div style="flex: 1; height: 1px; background: #e5e7eb;"></div>
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="username" class="form-label">Username or Email</label>
        <input id="username" type="text" class="input-field" placeholder="admin" autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="toggle-pw-wrapper">
          <input id="password" type="password" class="input-field" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="eye-btn" id="eye-btn" aria-label="Toggle password visibility">
            <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="login-btn">Sign In</button>
    </form>

    <!-- Clickable Demo Credentials with Auto-fill -->
    <div class="demo-box" id="demo-box" style="cursor: pointer;" title="Click to auto-fill demo credentials">
      <span class="material-symbols-outlined text-[16px]" style="vertical-align: -3px; margin-right: 4px;">key</span>
      <strong>Demo:</strong> <span style="text-decoration: underline;">admin / arbor2024</span>
      <span style="display: block; font-size: 0.72rem; color: #15803d; margin-top: 2px;">(Click here to auto-fill)</span>
    </div>

    <div class="footer-center">
      <p class="auth-footer">
        Don't have an account? <a href="signup.html">Create Account</a>
      </p>
      <a href="index.html" class="back-home">← Back to Public Site</a>
    </div>
  </div>

  <script>
    const DUMMY_USERS = [
      { username: 'admin', password: 'arbor2024', role: 'admin', name: 'Tyler Vance' }
    ];

    // If already logged in, redirect to admin dashboard
    if (localStorage.getItem('arborpro_auth')) {
      window.location.href = 'admin.html';
    }

    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const loginBtn = document.getElementById('login-btn');
    const eyeBtn = document.getElementById('eye-btn');
    const passwordInput = document.getElementById('password');
    const usernameInput = document.getElementById('username');
    const demoBox = document.getElementById('demo-box');

    // Auto-fill demo credentials on click
    demoBox?.addEventListener('click', () => {
      usernameInput.value = 'admin';
      passwordInput.value = 'arbor2024';
      errorMsg.style.display = 'none';
      usernameInput.focus();
    });

    // Toggle password visibility
    eyeBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeBtn.innerHTML = isPassword
        ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    });

    // Handle Login submission - Always allow entry without password
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      loginBtn.textContent = 'Opening Dashboard…';
      loginBtn.disabled = true;

      // Auto-set authentication session
      const authPayload = { 
        user: usernameInput.value.trim() || 'admin', 
        name: 'Tyler Vance', 
        role: 'admin', 
        loginTime: Date.now() 
      };
      localStorage.setItem('arborpro_auth', JSON.stringify(authPayload));

      setTimeout(() => {
        window.location.href = 'admin.html';
      }, 300);
    });

    // Make demo box click immediately log in and go to admin.html
    demoBox?.addEventListener('click', () => {
      localStorage.setItem('arborpro_auth', JSON.stringify({
        user: 'admin',
        name: 'Tyler Vance',
        role: 'admin',
        loginTime: Date.now()
      }));
      window.location.href = 'admin.html';
    });
  </script>
</body>
</html>
