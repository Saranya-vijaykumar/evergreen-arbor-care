<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Evergreen Arbor Care</title>
  <script type="module" src="/src/js/nav.js"></script>
  <link rel="stylesheet" href="/src/css/style.css" />
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a4731 0%, #2d7a4f 50%, #1a4731 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif; padding: 1rem;
    }
    .login-card {
      background: #fff; border-radius: 1.25rem;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
      width: 100%; max-width: 440px; padding: 2.5rem 2rem;
    }
    .input-field {
      width: 100%; padding: 0.75rem 1rem;
      border: 1.5px solid #d1d5db; border-radius: 0.6rem;
      font-size: 0.95rem; outline: none; transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .input-field:focus { border-color: #2d7a4f; box-shadow: 0 0 0 3px rgba(45,122,79,0.12); }
    .btn-primary {
      width: 100%; padding: 0.8rem; background: #2d7a4f; color: #fff;
      border: none; border-radius: 0.6rem; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover { background: #1a5c38; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { background: #6b9e82; cursor: not-allowed; }
    .error-msg {
      background: #fef2f2; border: 1px solid #fca5a5; color: #dc2626;
      padding: 0.65rem 1rem; border-radius: 0.5rem; font-size: 0.88rem; display: none;
    }
    .logo-circle {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #2d7a4f, #5cb85c); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem; box-shadow: 0 4px 14px rgba(45,122,79,0.3);
    }
    .divider { display: flex; align-items: center; gap: 0.75rem; color: #9ca3af; font-size: 0.82rem; margin: 1.25rem 0; }
    .divider::before, .divider::after { content:''; flex:1; border-top: 1px solid #e5e7eb; }
    .hint-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 0.5rem; padding: 0.6rem 0.9rem; font-size: 0.82rem; color: #15803d; }
    label { display: block; font-size: 0.88rem; font-weight: 500; color: #374151; margin-bottom: 0.35rem; }
    .toggle-pw { position: relative; }
    .toggle-pw input { padding-right: 2.8rem; }
    .eye-btn { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #6b7280; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-circle">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 8C8 10 5.9 16.17 3.82 19.82A2 2 0 0 0 5.6 22.5h12.8a2 2 0 0 0 1.78-2.68C18.1 16.17 16 10 17 8z"/>
        <path d="M12 22V10"/>
      </svg>
    </div>
    <h1 class="text-center text-2xl font-bold text-gray-800 mb-1">Evergreen Arbor Care</h1>
    <p class="text-center text-sm text-gray-500 mb-6">Admin Dashboard — Sign In</p>
    <div id="error-msg" class="error-msg mb-4">Invalid credentials. Please check your username and password.</div>
    <form id="login-form" novalidate>
      <div class="mb-4">
        <label for="username">Username or Email</label>
        <input id="username" type="text" class="input-field" placeholder="admin" autocomplete="username" />
      </div>
      <div class="mb-5">
        <label for="password">Password</label>
        <div class="toggle-pw">
          <input id="password" type="password" class="input-field" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="eye-btn" id="eye-btn" aria-label="Toggle password visibility">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
    </form>
    <div class="divider">Demo credentials</div>
    <div class="hint-box mb-5"><strong>Username:</strong> admin &nbsp;|&nbsp; <strong>Password:</strong> arbor2024</div>
    <p class="text-center text-sm text-gray-500">
      Don't have an account? <a href="signup.html" class="text-green-700 font-semibold hover:underline">Create Account</a>
    </p>
    <p class="text-center text-xs text-gray-400 mt-4">
      <a href="index.html" class="hover:underline">← Back to Public Site</a>
    </p>
  </div>
  <script>
    const DUMMY_USERS = [
      { username: 'admin', password: 'arbor2024', role: 'admin', name: 'Tyler Vance' }
    ];
    if (localStorage.getItem('arborpro_auth')) { window.location.href = 'admin.html'; }
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const loginBtn = document.getElementById('login-btn');
    const eyeBtn = document.getElementById('eye-btn');
    const passwordInput = document.getElementById('password');
    eyeBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeBtn.innerHTML = isPassword
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const registeredRaw = localStorage.getItem('arborpro_users');
      const registered = registeredRaw ? JSON.parse(registeredRaw) : [];
      const allUsers = [...DUMMY_USERS, ...registered];
      const user = allUsers.find(u => (u.username === username || u.email === username) && u.password === password);
      if (user) {
        loginBtn.textContent = 'Signing in…';
        loginBtn.disabled = true;
        errorMsg.style.display = 'none';
        const authPayload = { user: user.username || user.email, name: user.name, role: user.role, loginTime: Date.now() };
        localStorage.setItem('arborpro_auth', JSON.stringify(authPayload));
        setTimeout(() => { window.location.href = 'admin.html'; }, 600);
      } else {
        errorMsg.style.display = 'block';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    });
  </script>
</body>
</html>
