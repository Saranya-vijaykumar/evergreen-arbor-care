<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Evergreen Arbor Care</title>
  <script type="module" src="/src/js/nav.js"></script>
  <link rel="stylesheet" href="/src/css/style.css" />
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a4731 0%, #2d7a4f 50%, #1a4731 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif; padding: 1rem;
    }
    .card {
      background: #fff; border-radius: 1.25rem;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
      width: 100%; max-width: 460px; padding: 2.5rem 2rem;
    }
    .input-field {
      width: 100%; padding: 0.75rem 1rem;
      border: 1.5px solid #d1d5db; border-radius: 0.6rem;
      font-size: 0.95rem; outline: none; transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .input-field:focus { border-color: #2d7a4f; box-shadow: 0 0 0 3px rgba(45,122,79,0.12); }
    .btn-primary {
      width: 100%; padding: 0.8rem; background: #2d7a4f; color: #fff;
      border: none; border-radius: 0.6rem; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover { background: #1a5c38; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { background: #6b9e82; cursor: not-allowed; }
    .alert-msg {
      padding: 0.65rem 1rem; border-radius: 0.5rem; font-size: 0.88rem; display: none; margin-bottom: 1rem;
    }
    .alert-error { background: #fef2f2; border: 1px solid #fca5a5; color: #dc2626; }
    .alert-success { background: #f0fdf4; border: 1px solid #86efac; color: #15803d; }
    .logo-circle {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #2d7a4f, #5cb85c); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem; box-shadow: 0 4px 14px rgba(45,122,79,0.3);
    }
    label { display: block; font-size: 0.88rem; font-weight: 500; color: #374151; margin-bottom: 0.35rem; }
    .toggle-pw { position: relative; }
    .toggle-pw input { padding-right: 2.8rem; }
    .eye-btn { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #6b7280; }
    .strength-bar { height: 4px; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0%; }
    .field-err { font-size: 0.78rem; color: #dc2626; margin-top: 0.25rem; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-circle">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 8C8 10 5.9 16.17 3.82 19.82A2 2 0 0 0 5.6 22.5h12.8a2 2 0 0 0 1.78-2.68C18.1 16.17 16 10 17 8z"/>
        <path d="M12 22V10"/>
      </svg>
    </div>
    <h1 class="text-center text-2xl font-bold text-gray-800 mb-1">Create Account</h1>
    <p class="text-center text-sm text-gray-500 mb-6">Join Evergreen Arbor Care Admin</p>

    <div id="alert-box" class="alert-msg alert-error"></div>

    <form id="signup-form" novalidate>
      <div class="mb-4">
        <label for="fullname">Full Name</label>
        <input id="fullname" type="text" class="input-field" placeholder="Tyler Vance" autocomplete="name" />
        <span class="field-err" id="err-name">Please enter your full name.</span>
      </div>

      <div class="mb-4">
        <label for="email">Email Address</label>
        <input id="email" type="email" class="input-field" placeholder="admin@evergreenarbor.com" autocomplete="email" />
        <span class="field-err" id="err-email">Please enter a valid email address.</span>
      </div>

      <div class="mb-4">
        <label for="new-username">Username</label>
        <input id="new-username" type="text" class="input-field" placeholder="dispatcher01" autocomplete="username" />
        <span class="field-err" id="err-username">Username must be at least 3 characters.</span>
      </div>

      <div class="mb-2">
        <label for="new-password">Password</label>
        <div class="toggle-pw">
          <input id="new-password" type="password" class="input-field" placeholder="Min. 6 characters" autocomplete="new-password" />
          <button type="button" class="eye-btn" id="eye-pw" aria-label="Toggle password visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="mb-1" style="background:#e5e7eb; border-radius:2px; height:4px;">
        <div class="strength-bar" id="strength-bar"></div>
      </div>
      <div class="mb-4 text-xs text-gray-400" id="strength-label"></div>

      <div class="mb-5">
        <label for="confirm-password">Confirm Password</label>
        <div class="toggle-pw">
          <input id="confirm-password" type="password" class="input-field" placeholder="Re-enter password" autocomplete="new-password" />
          <button type="button" class="eye-btn" id="eye-cp" aria-label="Toggle confirm visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <span class="field-err" id="err-confirm">Passwords do not match.</span>
      </div>

      <button type="submit" class="btn-primary" id="signup-btn">Create Account</button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-5">
      Already have an account? <a href="login.html" class="text-green-700 font-semibold hover:underline">Sign In</a>
    </p>
    <p class="text-center text-xs text-gray-400 mt-3">
      <a href="index.html" class="hover:underline">← Back to Public Site</a>
    </p>
  </div>

  <script>
    if (localStorage.getItem('arborpro_auth')) { window.location.href = 'admin.html'; }

    function toggleEye(btnId, inputId) {
      const btn = document.getElementById(btnId);
      const inp = document.getElementById(inputId);
      btn.addEventListener('click', () => {
        const isPassword = inp.type === 'password';
        inp.type = isPassword ? 'text' : 'password';
        btn.innerHTML = isPassword
          ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
          : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
      });
    }
    toggleEye('eye-pw', 'new-password');
    toggleEye('eye-cp', 'confirm-password');

    // Password strength
    document.getElementById('new-password').addEventListener('input', function() {
      const val = this.value;
      const bar = document.getElementById('strength-bar');
      const label = document.getElementById('strength-label');
      let strength = 0;
      if (val.length >= 6) strength++;
      if (val.length >= 10) strength++;
      if (/[A-Z]/.test(val)) strength++;
      if (/[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;
      const levels = [
        { w: '20%', bg: '#ef4444', txt: 'Very weak' },
        { w: '40%', bg: '#f97316', txt: 'Weak' },
        { w: '60%', bg: '#eab308', txt: 'Fair' },
        { w: '80%', bg: '#22c55e', txt: 'Strong' },
        { w: '100%', bg: '#15803d', txt: 'Very strong' }
      ];
      if (val.length === 0) { bar.style.width = '0'; label.textContent = ''; return; }
      const lvl = levels[Math.min(strength - 1, 4)] || levels[0];
      bar.style.width = lvl.w;
      bar.style.background = lvl.bg;
      label.textContent = lvl.txt;
    });

    function showErr(id, show) {
      document.getElementById(id).style.display = show ? 'block' : 'none';
    }
    function showAlert(msg, type) {
      const box = document.getElementById('alert-box');
      box.className = 'alert-msg ' + (type === 'error' ? 'alert-error' : 'alert-success');
      box.textContent = msg;
      box.style.display = 'block';
    }

    document.getElementById('signup-form').addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;

      const name = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('new-username').value.trim();
      const password = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;

      if (!name) { showErr('err-name', true); valid = false; } else showErr('err-name', false);
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('err-email', true); valid = false; } else showErr('err-email', false);
      if (username.length < 3) { showErr('err-username', true); valid = false; } else showErr('err-username', false);
      if (password !== confirm) { showErr('err-confirm', true); valid = false; } else showErr('err-confirm', false);
      if (password.length < 6) { showAlert('Password must be at least 6 characters.', 'error'); valid = false; }

      if (!valid) return;

      // Check username/email not taken
      const raw = localStorage.getItem('arborpro_users');
      const users = raw ? JSON.parse(raw) : [];
      const taken = users.find(u => u.username === username || u.email === email);
      if (taken) { showAlert('Username or email already registered. Try signing in.', 'error'); return; }

      // Save new user
      const newUser = { username, email, password, name, role: 'dispatcher', createdAt: Date.now() };
      users.push(newUser);
      localStorage.setItem('arborpro_users', JSON.stringify(users));

      // Auto-login
      const authPayload = { user: username, name, role: 'dispatcher', loginTime: Date.now() };
      localStorage.setItem('arborpro_auth', JSON.stringify(authPayload));

      const btn = document.getElementById('signup-btn');
      btn.textContent = 'Account created! Redirecting…';
      btn.disabled = true;
      showAlert('Account created successfully! Redirecting to dashboard…', 'success');
      setTimeout(() => { window.location.href = 'admin.html'; }, 1200);
    });
  </script>
</body>
</html>
